events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name _;

        # Redirect root to the Admin UI
        location = / {
            return 301 /admin/;
        }

        # Redirect /admin to /admin/ (avoids 404 on the bare path)
        location = /admin {
            return 301 /admin/;
        }

        # QR auth page (single page served from the admin static dir)
        location = /qr {
            root /usr/share/nginx/html;
            try_files /qr.html =404;
        }

        # Admin UI (static files from infrastructure/admin_ui)
        location /admin/ {
            alias /usr/share/nginx/html/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Registry API -> registry:4321
        location /api/registry/ {
            proxy_pass http://registry:4321/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # eVault GraphQL/HTTP API -> evault-core:4000
        location /api/evault/ {
            proxy_pass http://evault-core:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            client_max_body_size 350m;
        }

        # eVault provisioning API -> evault-core:3001
        location /api/provision/ {
            proxy_pass http://evault-core:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            client_max_body_size 250m;
        }
    }
}
