# Minimal core stack: Postgres + Neo4j + registry + evault-core.
# Bring up with: docker compose -f docker-compose.core.yml up -d --build
# Secrets are read from the repo-root .env (auto-loaded by Compose).

name: metastate-core

services:
  postgres:
    image: postgres:17-alpine
    container_name: metastate-core-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: registry,provisioner,awareness
    volumes:
      - ./datastorage/postgres:/var/lib/postgresql/data
      - ./db/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:4.4
    container_name: metastate-core-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j}
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
    volumes:
      - ./datastorage/neo4j:/var/lib/neo4j/data
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j} 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot migration runners (reuse the app images, exit 0 when done).
  migrate-registry:
    build:
      context: .
      dockerfile: docker/Dockerfile.registry
    container_name: metastate-core-migrate-registry
    command:
      - node
      - -e
      - "const {AppDataSource}=require('/app/platforms/registry/api/dist/config/database.js');AppDataSource.initialize().then(()=>AppDataSource.runMigrations()).then(()=>{console.log('registry migrations applied');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
    environment:
      REGISTRY_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/registry
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-evault:
    build:
      context: .
      dockerfile: docker/Dockerfile.evault-core
    container_name: metastate-core-migrate-evault
    command:
      - node
      - -e
      - "const {AppDataSource}=require('/app/infrastructure/evault-core/dist/config/database.js');AppDataSource.initialize().then(()=>AppDataSource.runMigrations()).then(()=>{console.log('evault-core migrations applied');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
    environment:
      PROVISIONER_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/provisioner
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-aaas:
    build:
      context: .
      dockerfile: docker/Dockerfile.awareness-service
    container_name: metastate-core-migrate-aaas
    command:
      - node
      - -e
      - "const {AppDataSource}=require('/app/services/awareness-service/api/dist/database/data-source.js');AppDataSource.initialize().then(()=>AppDataSource.runMigrations()).then(()=>{console.log('awareness-service migrations applied');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
    environment:
      AWARENESS_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/awareness
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  registry:
    build:
      context: .
      dockerfile: docker/Dockerfile.registry
    container_name: metastate-core-registry
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      REGISTRY_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/registry
      REGISTRY_ENTROPY_KEY_JWK: '${REGISTRY_ENTROPY_KEY_JWK:?REGISTRY_ENTROPY_KEY_JWK must be set in .env}'
      REGISTRY_SHARED_SECRET: ${REGISTRY_SHARED_SECRET:-dev-secret-change-me}
      PUBLIC_REGISTRY_URL: http://localhost:4321
    depends_on:
      migrate-registry:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:4321/motd',(r)=>process.exit(r.statusCode===200?0:1))\"" ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  evault-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.evault-core
    container_name: metastate-core-evault-core
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "4000:4000"
    environment:
      # NOTE: only PROVISIONER_DATABASE_URL is set. evault-core's DataSource
      # prefers REGISTRY_DATABASE_URL; leaving it unset keeps runtime and
      # migrations on the same 'provisioner' database.
      PROVISIONER_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/provisioner
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j}
      PUBLIC_REGISTRY_URL: http://registry:4321
      PUBLIC_PROVISIONER_URL: ${PUBLIC_PROVISIONER_URL:-http://localhost:3001}
      # URI the eVault advertises to other platforms (and stores in the Registry
      # on provisioning). Must be reachable by those platforms: on a remote
      # stand point it at the host entry point, e.g.
      # http://<host>/api/evault -- otherwise resolve() hands out localhost:4000.
      PUBLIC_EVAULT_SERVER_URI: ${PUBLIC_EVAULT_SERVER_URI:-http://localhost:4000}
      REGISTRY_SHARED_SECRET: ${REGISTRY_SHARED_SECRET:-dev-secret-change-me}
      PROVISIONER_SIGNING_SEED: '${PROVISIONER_SIGNING_SEED:?PROVISIONER_SIGNING_SEED must be set in .env}'
      PROVISIONER_KID: ${PROVISIONER_KID:-provisioner-1}
      W3ID: ${W3ID:-@local-evault}
      PLATFORM_NAME: provisioner
      EXPRESS_PORT: "3001"
      FASTIFY_PORT: "4000"
      AWARENESS_SERVICE_URL: http://awareness-service:4100
      AWARENESS_INGEST_SECRET: ${AWARENESS_INGEST_SECRET:-replace-with-a-strong-secret}
    depends_on:
      migrate-evault:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',(r)=>process.exit(r.statusCode===200?0:1))\"" ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  awareness-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.awareness-service
    container_name: metastate-core-awareness-service
    restart: unless-stopped
    ports:
      - "4100:4100"
    environment:
      AWARENESS_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/awareness
      AWARENESS_API_PORT: "4100"
      AWARENESS_PUBLIC_URL: ${AWARENESS_PUBLIC_URL:-http://localhost:4100}
      AWARENESS_INGEST_SECRET: ${AWARENESS_INGEST_SECRET:-replace-with-a-strong-secret}
      PUBLIC_REGISTRY_URL: http://registry:4321
      AAAS_ADMIN_ENAMES: ${AAAS_ADMIN_ENAMES:-}
      AAAS_JWT_SECRET: ${AAAS_JWT_SECRET:-awareness-dev-secret}
      AWARENESS_MAX_ATTEMPTS: ${AWARENESS_MAX_ATTEMPTS:-3}
      AWARENESS_DELIVERY_POLL_MS: ${AWARENESS_DELIVERY_POLL_MS:-2000}
      AWARENESS_REGISTRY_SYNC_MS: ${AWARENESS_REGISTRY_SYNC_MS:-60000}
    depends_on:
      migrate-aaas:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:4100/health',(r)=>process.exit(r.statusCode===200?0:1))\"" ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Serves the admin UI and proxies registry/evault over HTTP (single entry point).
  nginx:
    image: nginx:alpine
    container_name: metastate-core-nginx
    restart: unless-stopped
    ports:
      - "8042:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/admin_ui:/usr/share/nginx/html:ro
    depends_on:
      registry:
        condition: service_healthy
      evault-core:
        condition: service_healthy
